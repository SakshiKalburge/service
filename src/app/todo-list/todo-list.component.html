
<ul class="list-group">
    <li *ngFor="let todo of todoArray"
    class="list-group-item d-flex justify-content-between">
        <strong>{{todo.todoItem}}</strong>
        <div>
            <button class="btn btn-sm bg-success mr-2">Edit</button>
            <button class="btn btn-sm bg-danger">Remove</button>
        </div>
    </li>
</ul>
